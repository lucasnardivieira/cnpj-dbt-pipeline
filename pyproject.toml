[project]
name = "cnpj-dbt-pipeline"
version = "1.0.0"
description = "dbt + DuckDB + Prefect pipeline over Brazil's public CNPJ (company registry) data"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "dbt-core==1.7.5",
    "dbt-duckdb==1.7.5",
    "duckdb==1.5.5",
    "pandas==3.0.5",
    "prefect==3.8.1",
    # dbt-core 1.7 imports distutils, removed from the stdlib in Python 3.12
    "setuptools",
    # dbt-core 1.7 calls a protobuf API that was removed in protobuf 5
    "protobuf>=4,<5",
]

[dependency-groups]
dev = [
    "ruff>=0.6",
    "sqlfluff>=3.0,<4",
    "sqlfluff-templater-dbt>=3.0,<4",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
