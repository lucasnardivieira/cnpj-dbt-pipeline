version: 2

models:
  - name: stg_empresas
    columns:
      - name: cnpj_basico
        tests:
          - not_null

  - name: stg_estabelecimentos
    columns:
      - name: uf
        tests:
          - not_null

  - name: stg_socios
    columns:
      - name: cnpj_basico
        tests:
          # A amostra e gerada por flows/extract.py a partir da INTERSECCAO de
          # cnpj_basico entre empresas e estabelecimentos (ver selecionar_amostra_cnpjs),
          # garantindo overlap real entre os arquivos. socios/simples sao filtrados pelo
          # mesmo conjunto de cnpj_basico, entao o relationship abaixo roda como 'error'.
          - relationships:
              to: ref('stg_empresas')
              field: cnpj_basico

  - name: fct_empresas
    columns:
      - name: cnpj_basico
        tests:
          - not_null
          - unique
      - name: capital_social_limpo
        tests:
          - not_null
          - dbt_utils.expression_is_true:
              expression: ">= 0"
      - name: status_empresa
        tests:
          - accepted_values:
              values: ['ativa', 'inativa']

  - name: dim_cnae
    columns:
      - name: codigo_cnae
        tests:
          - not_null
      - name: quantidade_empresas
        tests:
          - dbt_utils.expression_is_true:
              expression: "> 0"
