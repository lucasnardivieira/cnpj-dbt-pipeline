version: 2

models:
  - name: stg_empresas
    columns:
      - name: cnpj_basico
        tests:
          - not_null

  - name: stg_estabelecimentos
    columns:
      - name: uf
        tests:
          - not_null

  - name: stg_socios
    columns:
      - name: cnpj_basico
        tests:
          # severity=warn: as amostras de socios/empresas sao as primeiras 10k linhas
          # de arquivos brutos DIFERENTES e independentes, sem garantia de overlap de
          # cnpj_basico. Em producao (dado completo) este teste deve ser 'error'.
          - relationships:
              to: ref('stg_empresas')
              field: cnpj_basico
              config:
                severity: warn

  - name: fct_empresas
    columns:
      - name: cnpj_basico
        tests:
          - not_null
          - unique
      - name: capital_social_limpo
        tests:
          - not_null
          - dbt_utils.expression_is_true:
              expression: ">= 0"
      - name: status_empresa
        tests:
          - accepted_values:
              values: ['ativa', 'inativa']

  - name: dim_cnae
    columns:
      - name: codigo_cnae
        tests:
          - not_null
      - name: quantidade_empresas
        tests:
          - dbt_utils.expression_is_true:
              expression: "> 0"
